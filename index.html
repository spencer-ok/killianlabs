<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero {

            <a href="mailto:hello@killianlabs.com" class="btn btn-outline-light btn-lg mt-4">Get in Touch</a>

</html>
